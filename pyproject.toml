[project]
name = "bookshelf"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "psycopg2-binary",
    "feedparser",
    "colorthief",
    "Pillow",
    "boto3",
]

[dependency-groups]
dev = ["pytest", "pytest-cov", "moto[s3]", "ruff"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
