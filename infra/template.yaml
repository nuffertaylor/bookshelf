AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Bookshelf Lambda functions

Parameters:
  DatabaseUrl:
    Type: String
    Default: postgresql://postgres:dev@host.docker.internal:5432/bookshelf
  CertSecretArn:
    Type: String
    Default: ""
  SkipSslCert:
    Type: String
    Default: "true"
  AwsEndpointUrl:
    Type: String
    Default: ""
  # --- Hardcover OAuth (plans/02-hardcover-oauth.md) ---
  HardcoverClientId:
    Type: String
    Default: ""
  HardcoverRedirectUri:
    Type: String
    Default: "http://localhost:3000/oauth/callback"
  # Prod: ARN of the Secrets Manager secret holding the client secret (HardcoverClientSecret stays empty).
  HardcoverSecretArn:
    Type: String
    Default: ""
  # Local dev only: the client secret itself, passed from your shell by `make local`. Never commit a value.
  HardcoverClientSecret:
    Type: String
    NoEcho: true
    Default: ""
  # KMS key id used to encrypt stored Hardcover tokens. The default is a placeholder that matches no
  # real key: prod must pass the real key id, local dev the id of the LocalStack key.
  KmsKeyId:
    Type: String
    Default: "00000000-0000-0000-0000-000000000000"
  KmsEndpointUrl:
    Type: String
    Default: ""

Conditions:
  HasHardcoverSecretArn: !Not [!Equals [!Ref HardcoverSecretArn, ""]]

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'Content-Type'"
      AllowOrigin: "'*'"
  Function:
    Runtime: python3.12
    Timeout: 30
    Environment:
      Variables:
        DATABASE_URL: !Ref DatabaseUrl
        CERT_SECRET_ARN: !Ref CertSecretArn
        SKIP_SSL_CERT: !Ref SkipSslCert
        PYTHONPATH: /opt/python:/opt
        S3_ENDPOINT_URL: !Ref AwsEndpointUrl
        HARDCOVER_CLIENT_ID: !Ref HardcoverClientId
        HARDCOVER_REDIRECT_URI: !Ref HardcoverRedirectUri
        KMS_KEY_ID: !Ref KmsKeyId
        KMS_ENDPOINT_URL: !Ref KmsEndpointUrl
    Layers:
      - !Ref BookshelfLayer

Resources:
  # KMS (encrypt/decrypt the one token key) and, when configured, read access to the client secret.
  HardcoverAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - kms:Encrypt
              - kms:Decrypt
            Resource: !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/${KmsKeyId}
          - !If
            - HasHardcoverSecretArn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref HardcoverSecretArn
            - !Ref AWS::NoValue

  BookshelfLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: bookshelf-shared
      ContentUri: ../src/
      CompatibleRuntimes:
        - python3.12
    Metadata:
      BuildMethod: python3.12

  LoginRegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: loginRegister
      CodeUri: ../lambdas/login_register/
      Handler: handler.lambda_handler
      Events:
        Api:
          Type: Api
          Properties:
            Path: /loginregister
            Method: post

  ValidateAuthtokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: validateAuthtoken
      CodeUri: ../lambdas/validate_authtoken/
      Handler: handler.lambda_handler
      Events:
        Api:
          Type: Api
          Properties:
            Path: /validate
            Method: get

  UploadSpineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: uploadSpine
      CodeUri: ../lambdas/upload_spine/
      Handler: handler.lambda_handler
      Events:
        Api:
          Type: Api
          Properties:
            Path: /spine
            Method: post

  GenShelfFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: genShelf
      CodeUri: ../lambdas/gen_shelf/
      Handler: handler.lambda_handler
      Events:
        Api:
          Type: Api
          Properties:
            Path: /shelf
            Method: post

  GetGRBookshelfFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getGRBookshelf
      CodeUri: ../lambdas/get_gr_bookshelf/
      Handler: handler.lambda_handler
      Events:
        Api:
          Type: Api
          Properties:
            Path: /getgrbookshelf
            Method: get

  ImportGRLibraryCsvFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: importGRLibraryCsv
      CodeUri: ../lambdas/import_gr_library_csv/
      Handler: handler.lambda_handler
      MemorySize: 512
      Events:
        Api:
          Type: Api
          Properties:
            Path: /importgrlibrary
            Method: post

  GetGRBookDetailsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getGRBookDetails
      CodeUri: ../lambdas/get_gr_book_details/
      Handler: index.handler
      Runtime: nodejs20.x
      Layers: []
      Events:
        Api:
          Type: Api
          Properties:
            Path: /getgrbookdetails
            Method: get

  SetGoodreadsIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: setGoodreadsId
      CodeUri: ../lambdas/set_goodreads_id/
      Handler: handler.lambda_handler
      Events:
        Api:
          Type: Api
          Properties:
            Path: /setusergrid
            Method: post

  AddShelfBgFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: addShelfBg
      CodeUri: ../lambdas/add_shelf_bg/
      Handler: handler.lambda_handler

  GetShelfBgsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getShelfBgs
      CodeUri: ../lambdas/get_shelf_bgs/
      Handler: handler.lambda_handler

  AddUnfoundToUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: addUnfoundToUpload
      CodeUri: ../lambdas/add_unfound_to_upload/
      Handler: handler.lambda_handler
      Events:
        Api:
          Type: Api
          Properties:
            Path: /addunfoundtoupload
            Method: post

  GetUnfoundToUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getUnfoundToUpload
      CodeUri: ../lambdas/get_unfound_to_upload/
      Handler: handler.lambda_handler
      Events:
        Api:
          Type: Api
          Properties:
            Path: /getunfoundtoupload
            Method: get

  CalcDomColorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: calcDomColor
      CodeUri: ../lambdas/calc_dom_color/
      Handler: handler.lambda_handler

  CleanS3ShelvesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cleanS3Shelves
      CodeUri: ../lambdas/clean_s3_shelves/
      Handler: handler.lambda_handler
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)

  LeaderboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: leaderboard
      CodeUri: ../lambdas/leaderboard/
      Handler: handler.lambda_handler
      Events:
        Api:
          Type: Api
          Properties:
            Path: /leaderboard
            Method: get

  VisitFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: visit
      CodeUri: ../lambdas/visit/
      Handler: handler.lambda_handler
      Events:
        Api:
          Type: Api
          Properties:
            Path: /visit
            Method: post

  SetShelfOwnerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: setShelfOwner
      CodeUri: ../lambdas/set_shelf_owner/
      Handler: handler.lambda_handler
      Events:
        Api:
          Type: Api
          Properties:
            Path: /setshelfowner
            Method: post

  GetOwnerShelvesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getOwnerShelves
      CodeUri: ../lambdas/get_owner_shelves/
      Handler: handler.lambda_handler
      Events:
        Api:
          Type: Api
          Properties:
            Path: /getownershelves
            Method: get

  GetSpinesBySubmitterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getSpinesBySubmitter
      CodeUri: ../lambdas/get_spines_by_submitter/
      Handler: handler.lambda_handler
      Events:
        Api:
          Type: Api
          Properties:
            Path: /getbookspinesbysubmitter
            Method: get

  HardcoverAuthStartFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: hardcoverAuthStart
      CodeUri: ../lambdas/hardcover_auth_start/
      Handler: handler.lambda_handler
      Events:
        Api:
          Type: Api
          Properties:
            Path: /auth/hardcover/start
            Method: post

  HardcoverAuthCallbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: hardcoverAuthCallback
      CodeUri: ../lambdas/hardcover_auth_callback/
      Handler: handler.lambda_handler
      Environment:
        Variables:
          HARDCOVER_SECRET_ARN: !Ref HardcoverSecretArn
          HARDCOVER_CLIENT_SECRET: !Ref HardcoverClientSecret
      Policies:
        - !Ref HardcoverAccessPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /auth/hardcover/callback
            Method: post

  LogoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: logout
      CodeUri: ../lambdas/logout/
      Handler: handler.lambda_handler
      Environment:
        Variables:
          HARDCOVER_SECRET_ARN: !Ref HardcoverSecretArn
          HARDCOVER_CLIENT_SECRET: !Ref HardcoverClientSecret
      Policies:
        - !Ref HardcoverAccessPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /logout
            Method: post

  GetHardcoverShelvesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getHardcoverShelves
      CodeUri: ../lambdas/get_hardcover_shelves/
      Handler: handler.lambda_handler
      Timeout: 60
      Environment:
        Variables:
          HARDCOVER_SECRET_ARN: !Ref HardcoverSecretArn
          HARDCOVER_CLIENT_SECRET: !Ref HardcoverClientSecret
      Policies:
        - !Ref HardcoverAccessPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /hardcover/shelves
            Method: post

  GetHardcoverShelfFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getHardcoverShelf
      CodeUri: ../lambdas/get_hardcover_shelf/
      Handler: handler.lambda_handler
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          HARDCOVER_SECRET_ARN: !Ref HardcoverSecretArn
          HARDCOVER_CLIENT_SECRET: !Ref HardcoverClientSecret
      Policies:
        - !Ref HardcoverAccessPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /hardcover/shelf
            Method: post
