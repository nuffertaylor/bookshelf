AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Bookshelf Lambda functions

Parameters:
  # Prepended to every function name and the layer name. Leave empty for the production stack
  # (names must match the live functions); use "v2-" while the old manually deployed functions still exist.
  Prefix:
    Type: String
    Default: ""
  DatabaseUrl:
    Type: String
    Default: postgresql://postgres:dev@host.docker.internal:5432/bookshelf
  CertSecretArn:
    Type: String
    Default: ""
  SkipSslCert:
    Type: String
    Default: "true"
  AwsEndpointUrl:
    Type: String
    Default: ""

Conditions:
  HasCertSecretArn: !Not [!Equals [!Ref CertSecretArn, ""]]

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'Content-Type'"
      AllowOrigin: "'*'"
  Function:
    Runtime: python3.12
    Timeout: 30
    Environment:
      Variables:
        DATABASE_URL: !Ref DatabaseUrl
        CERT_SECRET_ARN: !Ref CertSecretArn
        SKIP_SSL_CERT: !Ref SkipSslCert
        PYTHONPATH: /opt/python:/opt
        S3_ENDPOINT_URL: !Ref AwsEndpointUrl
    Layers:
      - !Ref BookshelfLayer

Resources:
  # Applied to every function: S3 access to the spines bucket (the bucket name is hardcoded in
  # s3_dao.py) and read access to the DB SSL cert secret.
  SharedAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub arn:${AWS::Partition}:s3:::bookshelf-spines/*
          - !If
            - HasCertSecretArn
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref CertSecretArn
            - !Ref AWS::NoValue

  BookshelfLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${Prefix}bookshelf-shared"
      ContentUri: ../src/
      CompatibleRuntimes:
        - python3.12
    Metadata:
      BuildMethod: python3.12

  LoginRegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Prefix}loginRegister"
      CodeUri: ../lambdas/login_register/
      Handler: handler.lambda_handler
      Policies:
        - !Ref SharedAccessPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /loginregister
            Method: post

  ValidateAuthtokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Prefix}validateAuthtoken"
      CodeUri: ../lambdas/validate_authtoken/
      Handler: handler.lambda_handler
      Policies:
        - !Ref SharedAccessPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /validate
            Method: get

  UploadSpineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Prefix}uploadSpine"
      CodeUri: ../lambdas/upload_spine/
      Handler: handler.lambda_handler
      Policies:
        - !Ref SharedAccessPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /spine
            Method: post

  GenShelfFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Prefix}genShelf"
      CodeUri: ../lambdas/gen_shelf/
      Handler: handler.lambda_handler
      Policies:
        - !Ref SharedAccessPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /shelf
            Method: post

  GetGRBookshelfFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Prefix}getGRBookshelf"
      CodeUri: ../lambdas/get_gr_bookshelf/
      Handler: handler.lambda_handler
      Policies:
        - !Ref SharedAccessPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /getgrbookshelf
            Method: get

  ImportGRLibraryCsvFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Prefix}importGRLibraryCsv"
      CodeUri: ../lambdas/import_gr_library_csv/
      Handler: handler.lambda_handler
      Policies:
        - !Ref SharedAccessPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /importgrlibrary
            Method: post

  GetGRBookDetailsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Prefix}getGRBookDetails"
      CodeUri: ../lambdas/get_gr_book_details/
      Handler: index.handler
      Policies:
        - !Ref SharedAccessPolicy
      Runtime: nodejs22.x
      Layers: []
      Events:
        Api:
          Type: Api
          Properties:
            Path: /getgrbookdetails
            Method: get

  SetGoodreadsIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Prefix}setGoodreadsId"
      CodeUri: ../lambdas/set_goodreads_id/
      Handler: handler.lambda_handler
      Policies:
        - !Ref SharedAccessPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /setusergrid
            Method: post

  AddShelfBgFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Prefix}addShelfBg"
      CodeUri: ../lambdas/add_shelf_bg/
      Handler: handler.lambda_handler
      Policies:
        - !Ref SharedAccessPolicy

  GetShelfBgsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Prefix}getShelfBgs"
      CodeUri: ../lambdas/get_shelf_bgs/
      Handler: handler.lambda_handler
      Policies:
        - !Ref SharedAccessPolicy

  AddUnfoundToUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Prefix}addUnfoundToUpload"
      CodeUri: ../lambdas/add_unfound_to_upload/
      Handler: handler.lambda_handler
      Policies:
        - !Ref SharedAccessPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /addunfoundtoupload
            Method: post

  GetUnfoundToUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Prefix}getUnfoundToUpload"
      CodeUri: ../lambdas/get_unfound_to_upload/
      Handler: handler.lambda_handler
      Policies:
        - !Ref SharedAccessPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /getunfoundtoupload
            Method: get

  CalcDomColorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Prefix}calcDomColor"
      CodeUri: ../lambdas/calc_dom_color/
      Handler: handler.lambda_handler
      Policies:
        - !Ref SharedAccessPolicy

  CleanS3ShelvesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Prefix}cleanS3Shelves"
      CodeUri: ../lambdas/clean_s3_shelves/
      Handler: handler.lambda_handler
      Policies:
        - !Ref SharedAccessPolicy
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)

  LeaderboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Prefix}leaderboard"
      CodeUri: ../lambdas/leaderboard/
      Handler: handler.lambda_handler
      Policies:
        - !Ref SharedAccessPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /leaderboard
            Method: get

  VisitFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Prefix}visit"
      CodeUri: ../lambdas/visit/
      Handler: handler.lambda_handler
      Policies:
        - !Ref SharedAccessPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /visit
            Method: post

  SetShelfOwnerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Prefix}setShelfOwner"
      CodeUri: ../lambdas/set_shelf_owner/
      Handler: handler.lambda_handler
      Policies:
        - !Ref SharedAccessPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /setshelfowner
            Method: post

  GetOwnerShelvesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Prefix}getOwnerShelves"
      CodeUri: ../lambdas/get_owner_shelves/
      Handler: handler.lambda_handler
      Policies:
        - !Ref SharedAccessPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /getownershelves
            Method: get

  GetSpinesBySubmitterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Prefix}getSpinesBySubmitter"
      CodeUri: ../lambdas/get_spines_by_submitter/
      Handler: handler.lambda_handler
      Policies:
        - !Ref SharedAccessPolicy
      Events:
        Api:
          Type: Api
          Properties:
            Path: /getbookspinesbysubmitter
            Method: get

Outputs:
  ApiUrl:
    Description: Base URL of the API (use as REACT_APP_API_URL, with a trailing slash)
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/"
