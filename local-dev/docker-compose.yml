services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: bookshelf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - ./migrate.sql:/docker-entrypoint-initdb.d/migrate.sql

  localstack:
    image: localstack/localstack:2.3
    environment:
      SERVICES: s3
    ports:
      - "4566:4566"
